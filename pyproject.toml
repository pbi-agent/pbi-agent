[project]
name = "pbi-agent"
version = "0.50.0"
description = "Multi-provider lightweight local coding agent"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "lark==1.3.1",
    "mcp==2.3.0",
    "python-dotenv==1.2.4",
    "rich==15.0.0",
    "uvicorn[standard]==0.54.0",
    "codetool-explore==0.7.1",
    "codetool-shell==0.1.3",
]

[project.scripts]
pbi-agent = "pbi_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_agent"]

# Non-Python files inside packages are included automatically when they are
# tracked by git (hatchling default behaviour).  Only add force-include
# entries for assets that live *outside* the packages listed above.

[tool.fastapi]
entrypoint = "pbi_agent.web.serve:app"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "PLW1510"]
ignore = ["B009", "B010"]  # getattr/setattr used deliberately for untyped dynamic attrs

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: slow tests",
    "integration: integration tests",
]
addopts = "-q --tb=short -x"

[tool.basedpyright]
include = ["src"]
exclude = [
    "**/__pycache__",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "webapp",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportUnusedFunction = "error"
reportUnusedClass = "error"
reportUnusedVariable = "error"
reportUnusedImport = "error"

[dependency-groups]
dev = [
    "basedpyright==1.40.2",
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff==0.17.4",
    "vulture==2.16",
]
